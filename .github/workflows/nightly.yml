name: Nightly benchmarks (non-gating)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,jax]"
      - run: python -m benchmarks.run --all --quick --out bench.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench.json
