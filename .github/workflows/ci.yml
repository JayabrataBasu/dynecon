name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Gates (layout, lint, types, tests, dead code)
        shell: bash
        run: |
          python scripts/check_test_layout.py
          python scripts/check_progress.py
          ruff check .
          mypy dynecon
          pytest -m "not slow and not jax"
          vulture dynecon scripts/vulture_whitelist.py
          python scripts/check_usage.py
          python scripts/check_near_future.py

  no-numba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip uninstall -y numba
      - run: pytest -m "not numba and not jax and not slow"

  jax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,jax]"
      - run: pytest -m jax

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,jax]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml

  min-versions:
    # installs the declared dependency floors (python 3.10) to check they are honest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [core, jax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
      - name: Install floors
        run: |
          {
            echo "numpy==1.25.*"
            echo "scipy==1.11.*"
            echo "numba==0.59.*"
            echo "jax==0.4.25"
            echo "jaxlib==0.4.25"
            echo "ml_dtypes<0.5"
          } > floors.txt
          python -m pip install -c floors.txt -e . pytest hypothesis pandas matplotlib
          if [ "${{ matrix.stack }}" = "jax" ]; then python -m pip install -c floors.txt jax jaxlib; fi
          python -m pip list | grep -i -E "^(numpy|scipy|numba|jax|jaxlib) "
      - name: Tests
        run: |
          if [ "${{ matrix.stack }}" = "jax" ]; then pytest -m jax; else pytest -m "not slow and not jax"; fi

  pip-audit:
    # non-gating supply-chain check (plan P17.11)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0"
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: pip-audit
