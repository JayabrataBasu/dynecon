name: Docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,docs,jax]"
      - run: python scripts/gen_model_docs.py
      - run: sphinx-build -b html docs docs/_build/html -W --keep-going
