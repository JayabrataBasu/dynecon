name: Docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,docs,jax]"
      - run: python scripts/gen_model_docs.py
      - run: sphinx-build -b html docs docs/_build/html -W --keep-going
