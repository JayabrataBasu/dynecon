[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econkit"
version = "0.1.0.dev0"
description = "A Python library for computational economics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "EconKit Contributors" }]
dependencies = [
  "numpy>=1.25",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools]
packages = ["econkit", "econkit.core", "econkit.model", "econkit.numerics", "econkit.numerics.backends"]

[tool.setuptools.package-data]
"econkit" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numba"]
ignore_missing_imports = true
